spring.application.name=healtify

spring.datasource.url=jdbc:postgresql://localhost:6969/database
spring.datasource.username=admin
spring.datasource.password=admin
spring.datasource.driver-class-name=org.postgresql.Driver
spring.jpa.hibernate.ddl-auto=update
#spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.defer-datasource-initialization=true
spring.jpa.properties.hibernate.dialect = org.hibernate.dialect.PostgreSQLDialect

# Bez tego Spring wycina pole "message" z odpowiedzi bledow i front dostaje samo
# {"status":403,"error":"Forbidden"}. Komunikaty z ResponseStatusException (np. "Ten pacjent
# jest juz przypisany") sa pisane pod uzytkownika, wiec maja do niego docierac.
server.error.include-message=always

